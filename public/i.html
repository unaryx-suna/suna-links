<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Surfaces the App Clip card in iOS Safari. A tapped link never shows one
       on its own — this meta tag is what does it. Bundle id only, no team prefix. -->
  <meta name="apple-itunes-app" content="app-id=6759053765, app-clip-bundle-id=com.unaryx.TravelMug.Clip">

  <title>An itinerary on Suna</title>
  <meta property="og:title" content="An itinerary on Suna">
  <meta property="og:description" content="A route someone actually walked, with their own photos and notes.">
  <meta property="og:type" content="article">
  <meta name="twitter:card" content="summary">

  <style>
    :root {
      --bg: #1C1812;      /* warm espresso — matches the app, not pure black */
      --surface: #272018;
      --text: #F2EAD8;
      --subtext: #A89070;
      --accent: #FAC775;
    }
    * { box-sizing: border-box; }
    /* `.byline { display: flex }` beat the hidden attribute, so the generic
       page showed an empty avatar circle under its title. */
    [hidden] { display: none !important; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100svh;
      text-align: center; padding: 28px;
    }
    .wrap { max-width: 460px; width: 100%; }
    .eyebrow {
      font-size: 11px; font-weight: 600; letter-spacing: 1.6px;
      color: var(--accent); text-transform: uppercase; margin-bottom: 14px;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px; line-height: 1.25; margin: 0 0 12px; font-weight: 700;
    }
    p.lede {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px; line-height: 1.6; color: rgba(242,234,216,.88);
      margin: 0 0 8px;
    }
    p.meta { font-size: 13px; color: var(--subtext); margin: 0 0 30px; }
    a.cta {
      background: var(--accent); color: rgba(0,0,0,.85);
      padding: 15px 34px; border-radius: 999px; text-decoration: none;
      font-weight: 700; font-size: 16px; display: inline-block;
    }
    .byline {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      margin-bottom: 22px;
    }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--surface); object-fit: cover;
    }
    .byline span { font-size: 14px; font-weight: 600; }
    .rule { height: 1px; background: #3D3020; margin: 26px 0 18px; }
    .foot { font-size: 12px; color: var(--subtext); }

    /* ── The preview (W-15) ─────────────────────────────────────────────
       Server-rendered by api/itinerary.js for a public itinerary. The page
       above stays exactly as it was for a private, draft or missing slug.
       Every image box has its height set here, so nothing moves as photos
       arrive (CLS 0), and the dock is fixed, so it never pushes content. */
    body.pv-body {
      display: block; text-align: left; padding: 0 0 148px;
      justify-content: flex-start; min-height: 0;
    }
    .pv { max-width: 640px; margin: 0 auto; }
    .cover { position: relative; height: 360px; overflow: hidden; background: var(--surface); }
    .cover-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .cover-plain { height: 240px; }
    .cover-mark {
      position: absolute; left: 50%; top: 34%; width: 72px; height: 72px; margin-left: -36px;
      border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFE3AE, var(--accent) 60%, #C9933F);
      opacity: .9;
    }
    .cover-fade {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(28,24,18,0) 35%, rgba(28,24,18,.72) 72%, var(--bg) 100%);
    }
    .cover-text { position: absolute; left: 20px; right: 20px; bottom: 18px; }
    .cover-text h1 { font-size: 30px; margin: 0 0 6px; color: #fff; }
    .cover-sub { margin: 0; font-size: 14px; color: rgba(255,255,255,.82); }
    .about { padding: 18px 20px 6px; }
    .by { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .by-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--surface); flex: none; }
    .by-initial { display: grid; place-items: center; font-weight: 700; color: var(--accent); }
    .by-name { margin: 0; font-size: 15px; font-weight: 600; }
    .by-sub { margin: 2px 0 0; font-size: 13px; color: var(--subtext); }
    .tag {
      display: inline-block; margin-left: 6px; padding: 2px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 700; letter-spacing: .4px; vertical-align: 2px;
      background: rgba(250,199,117,.16); color: var(--accent);
    }
    .intro {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px; line-height: 1.6; color: rgba(242,234,216,.9); margin: 0;
    }
    .stops { list-style: none; margin: 0; padding: 8px 20px 0; }
    .stop { padding: 18px 0; border-bottom: 1px solid #3D3020; }
    .stop:last-child { border-bottom: 0; }
    .day { padding: 18px 0 0; }
    .day-label { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--subtext); }
    .stop-pic { height: 140px; border-radius: 12px; overflow: hidden; background: var(--surface); margin-bottom: 12px; }
    .stop-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .stop-meta { margin: 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: .3px; color: var(--accent); }
    .stop-name { margin: 0; font-size: 19px; line-height: 1.3; font-weight: 600; }
    .stop-area { margin: 3px 0 0; font-size: 14px; color: var(--subtext); }
    .stop-note {
      margin: 10px 0 0; padding-left: 12px; border-left: 3px solid var(--accent);
      font-family: Georgia, "Times New Roman", serif; font-size: 16px; line-height: 1.55;
      color: rgba(242,234,216,.9); white-space: pre-line;
    }
    .dock {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; text-align: center;
      padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(28,24,18,0), var(--bg) 30%);
    }
    .dock .cta { display: block; max-width: 420px; margin: 0 auto; padding: 16px 20px; }
    .dock-sub { margin: 8px auto 0; max-width: 420px; font-size: 13px; color: var(--subtext); }
    @media (min-width: 700px) {
      .cover { margin-top: 24px; border-radius: 18px; }
      .cover-text { left: 28px; right: 28px; bottom: 24px; }
      .cover-text h1 { font-size: 36px; }
    }
  </style>
</head>
<body>
  <!--BODY-->
  <div class="wrap">
    <div class="eyebrow" id="eyebrow">Itinerary</div>
    <h1 id="title">An itinerary on Suna</h1>

    <div class="byline" id="byline" hidden>
      <img class="avatar" id="avatar" alt="">
      <span id="creator"></span>
    </div>

    <p class="lede" id="intro">A route someone actually walked, with their own photos and notes for each stop.</p>
    <p class="meta" id="meta"></p>

    <a class="cta" id="cta" href="https://apps.apple.com/app/id6759053765">Get Suna — Free</a>

    <div class="rule"></div>
    <p class="foot">Open on iPhone to follow the route, with each stop's notes as you arrive.</p>
  </div>
  <!--/BODY-->

  <script>
    (function () {
      var parts = window.location.pathname.split('/').filter(Boolean);
      var raw = parts[1] || '';
      // Links now read /i/old-kl-on-foot--cz2fcegzfk — the readable part is
      // decoration and the real slug is whatever follows the last "--". Bare
      // slugs still work, so links issued before this keep resolving.
      var slug = raw.indexOf('--') === -1 ? raw : raw.split('--').pop();
      var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
      // Set by api/itinerary.js when it rendered the itinerary itself.
      var preview = document.body.getAttribute('data-preview') === '1';

      // On iOS, open the app through the CUSTOM SCHEME.
      //
      // This button used to point at 'https://app.unaryx.com/i/' + slug — the
      // same URL as this page. iOS deliberately does NOT route a universal link
      // to the app when the navigation starts on that same domain, so tapping it
      // only reloaded this page: the itinerary flashed, then the generic copy
      // came back while it re-fetched. A universal link still works when the
      // link is tapped from Messages, Mail or Notes; it can never work from
      // here. The scheme has no such restriction.
      //
      // If the app isn't installed the scheme goes nowhere and nothing happens,
      // so fall back to the App Store — but only if we're still on screen. When
      // the app DOES open, this page is backgrounded and the redirect must not
      // fire, or the user comes back to the App Store later.
      // WHERE A PARTNER'S TOKEN SURVIVES TO.
      //
      // A counter card at a WORQ reception desk sends someone to
      // /i/<slug>?via=partner-worq-ttdi. Both App Store links on this page
      // threw the token away — the button's default href and the fallback
      // redirect below — so a download that started at that desk arrived
      // with nothing to credit it to, which is the single number the pilot
      // exists to produce.
      //
      // Only `partner-` tokens go on the App Store link. Every other `via`
      // is a person's share and keeps today's behaviour, because `ct` is a
      // campaign field and a creator is not a campaign.
      var viaParam = new URLSearchParams(window.location.search).get('via');
      var APPSTORE = 'https://apps.apple.com/app/id6759053765';
      function storeURL() {
        if (!viaParam || viaParam.indexOf('partner-') !== 0) return APPSTORE;
        return 'https://apps.apple.com/au/app/suna-things-to-do-near-you/id6759053765'
          + '?pt=128539200&ct=' + encodeURIComponent(viaParam) + '&mt=8';
      }
      document.getElementById('cta').href = storeURL();

      if (isIOS && slug) {
        var cta = document.getElementById('cta');
        // Carry ?via= across the hand-off. The scheme URL is a fresh URL, so
        // anything not copied here is dropped — which is how every open through
        // this button used to arrive at the app with no idea whose share it was.
        var via = viaParam;
        cta.href = 'suna://itinerary?slug=' + encodeURIComponent(slug)
                 + (via ? '&via=' + encodeURIComponent(via) : '');
        // The preview's button keeps its words; only the generic page says "Open".
        if (!preview) cta.textContent = 'Open in Suna';

        cta.addEventListener('click', function () {
          var start = Date.now();
          setTimeout(function () {
            // Backgrounded, or the timer was starved while the app launched —
            // either way the app took the tap.
            if (document.hidden || Date.now() - start > 1600) return;
            window.location.href = storeURL();
          }, 1200);
        });
      }

      // Count the preview's button. A number, nothing about the reader: which
      // platform, and whether the tap went to the app's scheme or the store.
      if (preview) {
        document.getElementById('cta').addEventListener('click', function () {
          try {
            var u = '/api/cta?platform=' + (isIOS ? 'ios' : (/Android/.test(navigator.userAgent) ? 'android' : 'other'))
              + '&has_app_scheme=' + (isIOS && slug ? '1' : '0');
            if (navigator.sendBeacon) navigator.sendBeacon(u);
            else fetch(u, { method: 'POST', keepalive: true }).catch(function () {});
          } catch (e) { /* counting must never affect the page */ }
        });
      }

      if (!slug) return;

      // Count this open.
      //
      // The server-rendered HTML is edge-cached, so the function that renders
      // it does not run for most visitors — this request is never cached, and
      // is what "verified open" is actually counted from. sendBeacon survives
      // the page being closed immediately; fetch(keepalive) is the fallback for
      // browsers without it. Both are fire-and-forget: nothing here blocks or
      // affects what the reader sees, and a failure is ignored entirely.
      try {
        var q = new URLSearchParams(window.location.search);
        var beacon = '/api/open?slug=' + encodeURIComponent(slug)
          + (q.get('via') ? '&via=' + encodeURIComponent(q.get('via')) : '')
          + (q.get('ctx') ? '&ctx=' + encodeURIComponent(q.get('ctx')) : '')
          + (document.referrer ? '&ref=' + encodeURIComponent(document.referrer) : '');
        if (navigator.sendBeacon) {
          navigator.sendBeacon(beacon);
        } else {
          fetch(beacon, { method: 'POST', keepalive: true }).catch(function () {});
        }
      } catch (e) { /* counting must never affect the page */ }

      // The server already rendered the itinerary; nothing to fill in.
      if (preview) return;

      // Fill in the real itinerary from the anonymous-safe view. Only PUBLIC
      // published itineraries are readable, so a followers-only or draft slug
      // simply yields nothing and the generic copy above stands — the page must
      // never reveal that a private itinerary exists at this address.
      var SUPABASE_URL = 'https://voogrbonwmvfwtgzzrxc.supabase.co';
      var ANON_KEY = 'sb_publishable_Fbarg84I-sAT--HQkoZ9lw_y-YDKp7R';

      var url = SUPABASE_URL + '/rest/v1/public_itineraries'
        + '?share_slug=eq.' + encodeURIComponent(slug)
        + '&select=id,name,intro_story,resolved_city_name,recommended_timing,creator_username,creator_avatar_url,partner_name'
        + '&limit=1';

      fetch(url, { headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY } })
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (rows) {
          if (!rows || !rows.length) return;
          var it = rows[0];

          if (it.name) {
            document.getElementById('title').textContent = it.name;
            document.title = it.name + ' — Suna';
          }
          var bits = [it.resolved_city_name, it.recommended_timing].filter(Boolean);
          if (bits.length) document.getElementById('eyebrow').textContent = bits.join(' · ');
          if (it.intro_story) document.getElementById('intro').textContent = it.intro_story;

          // A PARTNER'S NAME REPLACES THE CREATOR'S, it does not join it.
          // WORQ's itineraries are built by someone at WORQ, and a reader
          // at their counter is being told whose recommendation this is —
          // "By WORQ" is the answer, not the name of the staff member who
          // typed it. The avatar is the creator's, so it goes too.
          if (it.partner_name) {
            document.getElementById('creator').textContent = 'By ' + it.partner_name;
            document.getElementById('avatar').hidden = true;
            document.getElementById('byline').hidden = false;
          } else if (it.creator_username) {
            document.getElementById('creator').textContent = '@' + it.creator_username;
            if (it.creator_avatar_url) document.getElementById('avatar').src = it.creator_avatar_url;
            document.getElementById('byline').hidden = false;
          }

          // Stop count is a second request, and only cosmetic — failure is silent
          // because a missing count shouldn't blank the page.
          fetch(SUPABASE_URL + '/rest/v1/public_itinerary_stops?plan_id=eq.'
                + encodeURIComponent(it.id) + '&select=id',
                { headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY } })
            .then(function (r) { return r.ok ? r.json() : []; })
            .then(function (stops) {
              if (stops && stops.length) {
                document.getElementById('meta').textContent =
                  stops.length + ' stop' + (stops.length === 1 ? '' : 's');
              }
            })
            .catch(function () {});
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>
