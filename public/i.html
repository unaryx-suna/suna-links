<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Surfaces the App Clip card in iOS Safari. A tapped link never shows one
       on its own — this meta tag is what does it. Bundle id only, no team prefix. -->
  <meta name="apple-itunes-app" content="app-id=6759053765, app-clip-bundle-id=com.unaryx.TravelMug.Clip">

  <title>An itinerary on Suna</title>
  <meta property="og:title" content="An itinerary on Suna">
  <meta property="og:description" content="A route someone actually walked, with their own photos and notes.">
  <meta property="og:type" content="article">
  <meta name="twitter:card" content="summary">

  <!-- Urbanist, the app's brandFont (Figma B1). `display=swap`, and the
       fallback below is metric-matched so the swap moves nothing (CLS 0). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700&display=swap">
  <style>
    /* Values are Figma B1, "The shared itinerary" (uYO3utn3nHK8cieyUZmZiM,
       2494:2799), read with the Figma tools on 12 Oct. */
    /* Arial, scaled per weight to Urbanist's measured widths (97.5% at 400,
       93.3% at 600, 94.4% at 700) with its ascent and descent (95 / 25), so
       the swap to Urbanist reflows nothing. */
    @font-face {
      font-family: "Urbanist Fallback"; font-weight: 400; src: local("Arial");
      size-adjust: 97.5%; ascent-override: 97.4%; descent-override: 25.6%; line-gap-override: 0%;
    }
    @font-face {
      font-family: "Urbanist Fallback"; font-weight: 600; src: local("Arial Bold"), local("Arial-BoldMT");
      size-adjust: 93.3%; ascent-override: 101.8%; descent-override: 26.8%; line-gap-override: 0%;
    }
    @font-face {
      font-family: "Urbanist Fallback"; font-weight: 700; src: local("Arial Bold"), local("Arial-BoldMT");
      size-adjust: 94.4%; ascent-override: 100.6%; descent-override: 26.5%; line-gap-override: 0%;
    }
    :root {
      --bg: #111;           /* AppTheme.brandInk */
      --card: #1a1a1a;
      --line: #2a2a2a;
      --text: #fff;
      --body: #dadada;
      --muted: #979592;
      --sand: #f6cb94;
      --ink-on-sand: #1e1b16;
      --font: Urbanist, "Urbanist Fallback", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    /* `.byline { display: flex }` beat the hidden attribute, so the generic
       page showed an empty circle under its title. */
    [hidden] { display: none !important; }
    body {
      margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100svh;
      text-align: center; padding: 28px;
    }

    /* ── The generic page: a private, draft or missing slug ─────────── */
    .wrap { max-width: 460px; width: 100%; }
    .mascot { display: flex; justify-content: center; height: 96px; margin-bottom: 18px; }
    .eyebrow {
      font-size: 12px; font-weight: 600; letter-spacing: 1.4px;
      color: var(--sand); text-transform: uppercase; margin-bottom: 12px;
    }
    h1 { font-size: 28px; line-height: 1.25; margin: 0 0 12px; font-weight: 700; }
    p.lede { font-size: 15px; line-height: 21px; color: var(--body); margin: 0 0 8px; }
    p.meta { font-size: 13px; color: var(--muted); margin: 0 0 28px; }
    a.cta {
      background: var(--sand); color: var(--ink-on-sand);
      padding: 15px 34px; border-radius: 26px; text-decoration: none;
      font-weight: 600; font-size: 17px; display: inline-block;
    }
    .byline { display: flex; align-items: center; justify-content: center; gap: 9px; margin-bottom: 22px; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--card); object-fit: cover; }
    .byline span { font-size: 14px; font-weight: 600; }
    .rule { height: 1px; background: var(--line); margin: 26px 0 18px; }
    .foot { font-size: 12px; color: var(--muted); }

    /* ── The preview (W-15), B1 ───────────────────────────────────────
       Every image box has its size set here, so nothing moves as photos
       arrive, and the bar is fixed, so it never pushes content. */
    body.pv-body {
      display: block; text-align: left; padding: 0 0 140px;
      justify-content: flex-start; min-height: 0;
    }
    .pv { max-width: 480px; margin: 0 auto; }
    .cover { position: relative; height: 360px; overflow: hidden; background: var(--card); }
    .cover-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .fade-top, .fade-bottom { position: absolute; left: 0; right: 0; pointer-events: none; }
    .fade-top { top: 0; height: 120px; background: linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,0)); }
    .fade-bottom { top: 140px; height: 220px; background: linear-gradient(180deg, rgba(0,0,0,0), #000); }
    .cover-plain .fade-bottom { background: linear-gradient(180deg, rgba(17,17,17,0), var(--bg)); }
    .cover-mascot { position: absolute; left: 0; right: 0; top: 70px; display: flex; justify-content: center; }
    .round-btn {
      position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 18px;
      border: 0; padding: 0; background: rgba(0,0,0,.35); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .cover-text { position: absolute; left: 16px; right: 16px; bottom: 33px; display: flex; flex-direction: column; gap: 6px; }
    /* Bottom-anchored where B1 puts one line (y 270-327), so a long title
       wraps upward instead of being cut. */
    .cover-text h1 { margin: 0; font-size: 28px; font-weight: 700; line-height: 34px; color: var(--text); }
    .cover-sub { margin: 0; font-size: 14px; line-height: 17px; color: rgba(255,255,255,.75); }
    .about { padding: 18px 16px 0; }
    .by { display: flex; align-items: center; gap: 12px; min-height: 40px; }
    .by-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--card); flex: none; }
    .by-initial { display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--sand); }
    .by-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .by-name { margin: 0; font-size: 16px; font-weight: 600; }
    .by-sub { margin: 0; font-size: 12px; color: var(--muted); }
    .follow {
      flex: none; border: 1px solid rgba(255,255,255,.5); border-radius: 999px; padding: 7px 14px;
      color: var(--text); font: 600 13px var(--font); text-decoration: none; background: transparent;
    }
    .tag {
      display: inline-block; margin-left: 6px; padding: 2px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 700; letter-spacing: .4px; vertical-align: 2px;
      background: rgba(246,203,148,.16); color: var(--sand);
    }
    .intro { margin: 16px 0 0; font-size: 15px; line-height: 21px; color: var(--body); white-space: pre-line; }
    .route-head { margin: 20px 16px 0; font-size: 17px; font-weight: 600; }
    .route { list-style: none; margin: 16px 0 0; padding: 0 16px 0 38px; position: relative; }
    /* The timeline: a 1 px line down the left, x 20.5, from the first dot. */
    .route::before { content: ""; position: absolute; left: 20.5px; top: 28px; bottom: 0; width: 1px; background: var(--line); }
    .stop { position: relative; margin-bottom: 16px; }
    .stop::before {
      content: ""; position: absolute; left: -22px; top: 18px; width: 10px; height: 10px;
      border-radius: 50%; background: var(--sand);
    }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
    .stop-pic { position: relative; height: 300px; background: #202020; }
    .stop-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .stop-pic::before, .stop-pic::after { content: ""; position: absolute; left: 0; right: 0; pointer-events: none; }
    .stop-pic::before { top: 0; height: 80px; background: linear-gradient(180deg, rgba(0,0,0,.45), rgba(0,0,0,0)); }
    .stop-pic::after { top: 180px; height: 120px; background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.7)); }
    .stop-text { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; }
    .stop-meta { margin: 0; font-size: 12px; font-weight: 600; color: var(--sand); }
    .stop-name { margin: 0; font-size: 18px; font-weight: 600; line-height: 22px; }
    .stop-area { margin: 0; font-size: 13px; color: var(--muted); }
    .stop-note {
      margin: 6px 0 0; padding-left: 12px; border-left: 3px solid var(--sand);
      font-size: 15px; line-height: 21px; color: var(--body); white-space: pre-line;
    }
    .day-label { margin: 8px 0 12px; font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
    .bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; background: var(--bg);
      border-top: 1px solid var(--line); text-align: center;
      padding: 14px 16px calc(30px + env(safe-area-inset-bottom));
    }
    .bar .cta {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      max-width: 448px; margin: 0 auto; padding: 15px 20px; border-radius: 26px;
    }
    .bar-sub { margin: 8px auto 0; font-size: 12px; color: var(--muted); }
    .toast {
      position: fixed; left: 50%; top: 64px; transform: translateX(-50%); z-index: 3;
      background: #2a2a2a; color: var(--text); font-size: 13px; padding: 8px 14px; border-radius: 999px;
    }
  </style>
</head>
<body>
  <!--BODY-->
  <div class="wrap">
    <div class="mascot"><!--MASCOT--></div>
    <div class="eyebrow" id="eyebrow">Itinerary</div>
    <h1 id="title">An itinerary on Suna</h1>

    <div class="byline" id="byline" hidden>
      <img class="avatar" id="avatar" alt="">
      <span id="creator"></span>
    </div>

    <p class="lede" id="intro">A route someone actually walked, with their own photos and notes for each stop.</p>
    <p class="meta" id="meta"></p>

    <a class="cta" id="cta" href="https://apps.apple.com/app/id6759053765">Get Suna — Free</a>

    <div class="rule"></div>
    <p class="foot">Open on iPhone to follow the route, with each stop's notes as you arrive.</p>
  </div>
  <!--/BODY-->

  <script>
    (function () {
      var parts = window.location.pathname.split('/').filter(Boolean);
      var raw = parts[1] || '';
      // Links now read /i/old-kl-on-foot--cz2fcegzfk — the readable part is
      // decoration and the real slug is whatever follows the last "--". Bare
      // slugs still work, so links issued before this keep resolving.
      var slug = raw.indexOf('--') === -1 ? raw : raw.split('--').pop();
      var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
      // Set by api/itinerary.js when it rendered the itinerary itself.
      var preview = document.body.getAttribute('data-preview') === '1';

      // On iOS, open the app through the CUSTOM SCHEME.
      //
      // This button used to point at 'https://app.unaryx.com/i/' + slug — the
      // same URL as this page. iOS deliberately does NOT route a universal link
      // to the app when the navigation starts on that same domain, so tapping it
      // only reloaded this page: the itinerary flashed, then the generic copy
      // came back while it re-fetched. A universal link still works when the
      // link is tapped from Messages, Mail or Notes; it can never work from
      // here. The scheme has no such restriction.
      //
      // If the app isn't installed the scheme goes nowhere and nothing happens,
      // so fall back to the App Store — but only if we're still on screen. When
      // the app DOES open, this page is backgrounded and the redirect must not
      // fire, or the user comes back to the App Store later.
      // WHERE A PARTNER'S TOKEN SURVIVES TO.
      //
      // A counter card at a WORQ reception desk sends someone to
      // /i/<slug>?via=partner-worq-ttdi. Both App Store links on this page
      // threw the token away — the button's default href and the fallback
      // redirect below — so a download that started at that desk arrived
      // with nothing to credit it to, which is the single number the pilot
      // exists to produce.
      //
      // Only `partner-` tokens go on the App Store link. Every other `via`
      // is a person's share and keeps today's behaviour, because `ct` is a
      // campaign field and a creator is not a campaign.
      var viaParam = new URLSearchParams(window.location.search).get('via');
      var APPSTORE = 'https://apps.apple.com/app/id6759053765';
      function storeURL() {
        if (!viaParam || viaParam.indexOf('partner-') !== 0) return APPSTORE;
        return 'https://apps.apple.com/au/app/suna-things-to-do-near-you/id6759053765'
          + '?pt=128539200&ct=' + encodeURIComponent(viaParam) + '&mt=8';
      }
      document.getElementById('cta').href = storeURL();
      // Follow, on the web, does what the bar's button does.
      var followers = document.querySelectorAll('[data-open-suna]');
      for (var i = 0; i < followers.length; i++) followers[i].href = storeURL();

      if (isIOS && slug) {
        var cta = document.getElementById('cta');
        // Carry ?via= across the hand-off. The scheme URL is a fresh URL, so
        // anything not copied here is dropped — which is how every open through
        // this button used to arrive at the app with no idea whose share it was.
        var via = viaParam;
        cta.href = 'suna://itinerary?slug=' + encodeURIComponent(slug)
                 + (via ? '&via=' + encodeURIComponent(via) : '');
        // The preview's button keeps its words; only the generic page says "Open".
        if (!preview) cta.textContent = 'Open in Suna';

        var handOff = function (el) {
          el.href = cta.href;
          el.addEventListener('click', function () {
            var start = Date.now();
            setTimeout(function () {
              // Backgrounded, or the timer was starved while the app launched —
              // either way the app took the tap.
              if (document.hidden || Date.now() - start > 1600) return;
              window.location.href = storeURL();
            }, 1200);
          });
        };
        handOff(cta);
        for (var j = 0; j < followers.length; j++) handOff(followers[j]);
      }

      // Share, on the cover. The Web Share sheet where there is one, else the
      // link goes on the clipboard and the page says so. The shared address is
      // the canonical one, so a share never forks attribution with a stale via.
      var shareBtn = document.getElementById('share');
      if (shareBtn) {
        shareBtn.addEventListener('click', function () {
          var link = document.querySelector('link[rel="canonical"]');
          var url = link ? link.href : window.location.href;
          var title = document.getElementById('title') ? document.getElementById('title').textContent : document.title;
          if (navigator.share) {
            navigator.share({ title: title, url: url }).catch(function () {});
            return;
          }
          var toast = document.getElementById('toast');
          var say = function (text) {
            if (!toast) return;
            toast.textContent = text; toast.hidden = false;
            clearTimeout(say.t); say.t = setTimeout(function () { toast.hidden = true; }, 2000);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(function () { say('Link copied'); },
              function () { say(url); });
          } else {
            say(url);
          }
        });
      }

      // Count the preview's button. A number, nothing about the reader: which
      // platform, and whether the tap went to the app's scheme or the store.
      if (preview) {
        document.getElementById('cta').addEventListener('click', function () {
          try {
            var u = '/api/cta?platform=' + (isIOS ? 'ios' : (/Android/.test(navigator.userAgent) ? 'android' : 'other'))
              + '&has_app_scheme=' + (isIOS && slug ? '1' : '0');
            if (navigator.sendBeacon) navigator.sendBeacon(u);
            else fetch(u, { method: 'POST', keepalive: true }).catch(function () {});
          } catch (e) { /* counting must never affect the page */ }
        });
      }

      if (!slug) return;

      // Count this open.
      //
      // The server-rendered HTML is edge-cached, so the function that renders
      // it does not run for most visitors — this request is never cached, and
      // is what "verified open" is actually counted from. sendBeacon survives
      // the page being closed immediately; fetch(keepalive) is the fallback for
      // browsers without it. Both are fire-and-forget: nothing here blocks or
      // affects what the reader sees, and a failure is ignored entirely.
      try {
        var q = new URLSearchParams(window.location.search);
        var beacon = '/api/open?slug=' + encodeURIComponent(slug)
          + (q.get('via') ? '&via=' + encodeURIComponent(q.get('via')) : '')
          + (q.get('ctx') ? '&ctx=' + encodeURIComponent(q.get('ctx')) : '')
          + (document.referrer ? '&ref=' + encodeURIComponent(document.referrer) : '');
        if (navigator.sendBeacon) {
          navigator.sendBeacon(beacon);
        } else {
          fetch(beacon, { method: 'POST', keepalive: true }).catch(function () {});
        }
      } catch (e) { /* counting must never affect the page */ }

      // The server already rendered the itinerary; nothing to fill in.
      if (preview) return;

      // Fill in the real itinerary from the anonymous-safe view. Only PUBLIC
      // published itineraries are readable, so a followers-only or draft slug
      // simply yields nothing and the generic copy above stands — the page must
      // never reveal that a private itinerary exists at this address.
      var SUPABASE_URL = 'https://voogrbonwmvfwtgzzrxc.supabase.co';
      var ANON_KEY = 'sb_publishable_Fbarg84I-sAT--HQkoZ9lw_y-YDKp7R';

      var url = SUPABASE_URL + '/rest/v1/public_itineraries'
        + '?share_slug=eq.' + encodeURIComponent(slug)
        + '&select=id,name,intro_story,resolved_city_name,recommended_timing,creator_username,creator_avatar_url,partner_name'
        + '&limit=1';

      fetch(url, { headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY } })
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (rows) {
          if (!rows || !rows.length) return;
          var it = rows[0];

          if (it.name) {
            document.getElementById('title').textContent = it.name;
            document.title = it.name + ' — Suna';
          }
          var bits = [it.resolved_city_name, it.recommended_timing].filter(Boolean);
          if (bits.length) document.getElementById('eyebrow').textContent = bits.join(' · ');
          if (it.intro_story) document.getElementById('intro').textContent = it.intro_story;

          // A PARTNER'S NAME REPLACES THE CREATOR'S, it does not join it.
          // WORQ's itineraries are built by someone at WORQ, and a reader
          // at their counter is being told whose recommendation this is —
          // "By WORQ" is the answer, not the name of the staff member who
          // typed it. The avatar is the creator's, so it goes too.
          if (it.partner_name) {
            document.getElementById('creator').textContent = 'By ' + it.partner_name;
            document.getElementById('avatar').hidden = true;
            document.getElementById('byline').hidden = false;
          } else if (it.creator_username) {
            document.getElementById('creator').textContent = '@' + it.creator_username;
            if (it.creator_avatar_url) document.getElementById('avatar').src = it.creator_avatar_url;
            document.getElementById('byline').hidden = false;
          }

          // Stop count is a second request, and only cosmetic — failure is silent
          // because a missing count shouldn't blank the page.
          fetch(SUPABASE_URL + '/rest/v1/public_itinerary_stops?plan_id=eq.'
                + encodeURIComponent(it.id) + '&select=id',
                { headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY } })
            .then(function (r) { return r.ok ? r.json() : []; })
            .then(function (stops) {
              if (stops && stops.length) {
                document.getElementById('meta').textContent =
                  stops.length + ' stop' + (stops.length === 1 ? '' : 's');
              }
            })
            .catch(function () {});
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>
